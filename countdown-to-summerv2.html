<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Countdown to Holidays 🐠</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  font-family: 'Nunito', sans-serif;
  overflow-x: hidden;
  position: relative;
  background: #006994;
}

/* ── WATER GRADIENT ── */
.water {
  position: fixed; inset: 0; z-index: 0;
  background: linear-gradient(
    180deg,
    #40c8f0 0%,
    #28a8d8 8%,
    #1a8ec0 18%,
    #1278a8 30%,
    #0e6494 44%,
    #0a5080 58%,
    #083d68 72%,
    #062e54 84%,
    #041e3a 100%
  );
}

/* ── SURFACE RIPPLE ── */
.surface {
  position: fixed; top: 0; left: 0; right: 0;
  height: 60px; z-index: 2;
  background: linear-gradient(180deg,
    rgba(120,220,255,0.7) 0%,
    rgba(80,200,240,0.4) 40%,
    transparent 100%
  );
  animation: surfaceRipple 4s ease-in-out infinite;
}
@keyframes surfaceRipple {
  0%,100% { transform: scaleX(1) translateY(0); }
  50%      { transform: scaleX(1.01) translateY(2px); }
}

/* ── LIGHT RAYS ── */
.rays {
  position: fixed; top: 0; left: 0; right: 0;
  height: 100%; z-index: 1; pointer-events: none;
  overflow: hidden;
}
.ray {
  position: absolute; top: 0;
  width: 80px; height: 100%;
  background: linear-gradient(180deg,
    rgba(160,230,255,0.26) 0%,
    rgba(120,210,250,0.16) 30%,
    rgba(80,180,230,0.08) 60%,
    rgba(40,140,200,0.03) 80%,
    transparent 100%
  );
  transform-origin: top center;
  animation: raySwing ease-in-out infinite alternate;
  border-radius: 0 0 50% 50%;
}
@keyframes raySwing {
  0%   { transform: rotate(var(--start-angle)) scaleX(1); opacity: var(--op); }
  100% { transform: rotate(var(--end-angle))   scaleX(1.3); opacity: calc(var(--op) * 0.7); }
}

/* ── BUBBLES ── */
.bubble {
  position: fixed; border-radius: 50%; z-index: 3;
  background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.6), rgba(255,255,255,0.1));
  border: 1px solid rgba(255,255,255,0.3);
  animation: bubbleRise ease-in-out infinite;
  animation-duration: 45s;
  pointer-events: none;
}
@keyframes bubbleRise {
  0%   { transform: translateY(0) translateX(0); opacity: 0; }
  8%   { opacity: 0.6; }
  92%  { opacity: 0.4; }
  100% { transform: translateY(-110vh) translateX(var(--drift)); opacity: 0; }
}

/* ── SANDY BOTTOM ── */
.sand {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 120px; z-index: 4;
  background: linear-gradient(180deg,
    #c8a850 0%,
    #d4b860 30%,
    #e0c870 60%,
    #c8a850 100%
  );
  border-radius: 60% 60% 0 0 / 40px 40px 0 0;
}
/* Sand texture ripples */
.sand::before {
  content: '';
  position: absolute; top: 20px; left: 0; right: 0;
  height: 8px;
  background: repeating-linear-gradient(
    90deg,
    transparent, transparent 30px,
    rgba(180,140,40,0.3) 30px, rgba(180,140,40,0.3) 60px
  );
  border-radius: 50%;
}
.sand::after {
  content: '';
  position: absolute; top: 40px; left: 20px; right: 20px;
  height: 6px;
  background: repeating-linear-gradient(
    90deg,
    transparent, transparent 40px,
    rgba(180,140,40,0.2) 40px, rgba(180,140,40,0.2) 80px
  );
  border-radius: 50%;
}

/* ── CORAL ── */
.coral {
  position: fixed; bottom: 80px; z-index: 5;
  font-size: 3rem; line-height: 1;
  animation: coralSway ease-in-out infinite alternate;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
  user-select: none;
}
@keyframes coralSway {
  0%   { transform: rotate(var(--sway-start)); }
  100% { transform: rotate(var(--sway-end)); }
}

/* ── SEA CREATURES ── */
.creature {
  position: fixed; z-index: 6;
  font-size: 2.2rem; user-select: none;
  pointer-events: none;
  filter: drop-shadow(0 3px 8px rgba(0,0,0,0.25));
}

/* Fish swimming left to right */
.fish-lr {
  animation: swimLR linear infinite;
}
@keyframes swimLR {
  0%   { transform: translateX(-120px) translateY(0); opacity: 0; }
  5%   { opacity: 1; }
  48%  { transform: translateX(53vw) translateY(var(--bob-mid)); }
  95%  { opacity: 1; }
  100% { transform: translateX(110vw) translateY(var(--bob-end)); opacity: 0; }
}

/* All fish swim left-to-right - staggered delays create natural ocean feel */

/* Turtle (slow, majestic) */
.turtle {
  animation: turtleSwim linear infinite;
}
@keyframes turtleSwim {
  0%   { transform: translateX(-150px) translateY(0) rotate(-3deg); opacity: 0; }
  8%   { opacity: 1; }
  50%  { transform: translateX(50vw) translateY(-20px) rotate(2deg); }
  92%  { opacity: 1; }
  100% { transform: translateX(110vw) translateY(-5px) rotate(-2deg); opacity: 0; }
}

/* Octopus (bobs and drifts) */
.octopus {
  animation: octopusDrift ease-in-out infinite;
}
@keyframes octopusDrift {
  0%,100% { transform: translateY(0) rotate(-5deg); }
  33%     { transform: translateY(-18px) rotate(3deg); }
  66%     { transform: translateY(-8px) rotate(-2deg); }
}

/* School of fish (group) */
.school {
  position: fixed; z-index: 6;
  display: flex; gap: 6px;
  animation: schoolSwim linear infinite;
  pointer-events: none;
}
@keyframes schoolSwim {
  0%   { transform: translateX(-200px); opacity: 0; }
  5%   { opacity: 1; }
  95%  { opacity: 1; }
  100% { transform: translateX(110vw); opacity: 0; }
}
.school-fish { font-size: 1.1rem; }

/* ── MAIN CONTENT ── */
.content {
  position: relative; z-index: 10;
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-start;
  padding: 28px 20px 160px;
}

/* ── MILESTONE ── */
.milestone {
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.4);
  border-radius: 50px; padding: 10px 28px;
  margin-bottom: 16px; font-size: 14px;
  font-weight: 800; color: #ffffff;
  text-align: center; max-width: 700px; width: 100%;
  display: none; letter-spacing: 0.5px;
  text-shadow: 0 1px 4px rgba(0,0,0,0.2);
}
.milestone.show { display: block; animation: popIn 0.4s ease; }
@keyframes popIn { from{transform:scale(0.85);opacity:0} to{transform:scale(1);opacity:1} }

/* ── MAIN CARD (frosted glass) ── */
.main-card {
  background: rgba(255,255,255,0.14);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 32px; padding: 36px 48px;
  text-align: center; max-width: 700px; width: 100%;
  box-shadow:
    0 20px 60px rgba(0,0,0,0.25),
    inset 0 1px 0 rgba(255,255,255,0.35),
    inset 0 -1px 0 rgba(255,255,255,0.1);
  margin-bottom: 16px;
  position: relative; overflow: hidden;
}
/* Subtle water caustic shimmer on card */
.main-card::before {
  content: '';
  position: absolute; inset: 0; border-radius: 32px;
  background: radial-gradient(ellipse at 30% 20%, rgba(160,230,255,0.12), transparent 60%),
              radial-gradient(ellipse at 70% 80%, rgba(100,200,240,0.08), transparent 50%);
  pointer-events: none; animation: caustic 6s ease-in-out infinite alternate;
}
@keyframes caustic {
  0%   { opacity: 0.6; transform: scale(1); }
  100% { opacity: 1;   transform: scale(1.05); }
}

.headline {
  font-family: 'Playfair Display', serif;
  font-size: clamp(0.95rem, 2vw, 1.2rem);
  color: rgba(255,255,255,0.8);
  letter-spacing: 3px; text-transform: uppercase;
  margin-bottom: 6px;
  text-shadow: 0 2px 8px rgba(0,0,80,0.3);
}

.big-number {
  font-family: 'Playfair Display', serif;
  font-size: clamp(5rem, 16vw, 9.5rem);
  font-weight: 900; color: #ffffff; line-height: 0.92;
  text-shadow:
    0 4px 20px rgba(0,100,180,0.4),
    0 0 60px rgba(160,230,255,0.3);
  margin: 8px 0;
}

.days-label {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.3rem, 3.5vw, 2rem);
  color: rgba(255,255,255,0.9);
  letter-spacing: 6px; text-transform: uppercase;
  margin-bottom: 18px;
  text-shadow: 0 2px 8px rgba(0,0,80,0.3);
}

.hms-row { display: flex; gap: 14px; justify-content: center; margin-bottom: 22px; }
.hms-unit {
  background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
  border-radius: 16px; padding: 11px 18px; min-width: 76px;
}
.hms-num {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.5rem, 3.5vw, 2rem);
  font-weight: 700; color: #e0f6ff; line-height: 1;
}
.hms-lbl {
  font-size: 10px; letter-spacing: 2px;
  text-transform: uppercase; color: rgba(255,255,255,0.6); margin-top: 3px;
}

.affirmation {
  font-size: clamp(0.88rem, 1.6vw, 1rem);
  color: rgba(255,255,255,0.95); font-weight: 700; font-style: italic;
  background: rgba(255,255,255,0.12); border-radius: 50px;
  padding: 10px 22px; display: inline-block;
  border: 1px solid rgba(255,255,255,0.25); line-height: 1.5;
  text-shadow: 0 1px 4px rgba(0,0,80,0.2);
}

/* ── STATS ── */
.stats-row {
  display: grid; grid-template-columns: repeat(3,1fr);
  gap: 12px; max-width: 700px; width: 100%; margin-bottom: 18px;
}
.stat-card {
  background: rgba(255,255,255,0.14);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.28);
  border-radius: 20px; padding: 18px 10px; text-align: center;
  box-shadow: 0 6px 20px rgba(0,0,0,0.15);
}
.stat-emoji { font-size: 1.5rem; margin-bottom: 5px; }
.stat-num {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.3rem, 2.8vw, 1.7rem);
  font-weight: 700; color: #e0f6ff; line-height: 1; margin-bottom: 3px;
  text-shadow: 0 2px 8px rgba(0,0,80,0.2);
}
.stat-label {
  font-size: 10px; letter-spacing: 1px;
  color: rgba(255,255,255,0.7); text-transform: uppercase; font-weight: 700;
}

/* ── PROGRESS BAR — bold and prominent ── */
.progress-wrap {
  max-width: 700px; width: 100%; margin-bottom: 16px;
  background: rgba(255,255,255,0.14);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.28);
  border-radius: 20px; padding: 16px 20px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.15);
}
.progress-top {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px;
}
.progress-end-label {
  font-size: 13px; color: #ffffff;
  font-weight: 800; letter-spacing: 0.5px;
  text-shadow: 0 1px 4px rgba(0,0,80,0.3);
}
.progress-mid-label {
  font-size: 13px; color: rgba(255,255,255,0.9);
  font-weight: 700; text-align: center;
  text-shadow: 0 1px 4px rgba(0,0,80,0.3);
}
.progress-track {
  height: 18px; background: rgba(0,0,0,0.2);
  border-radius: 9px; overflow: hidden;
  border: 1px solid rgba(255,255,255,0.2);
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
}
.progress-fill {
  height: 100%; border-radius: 9px;
  background: linear-gradient(90deg, #e09820, #f8c840, #ffe060);
  transition: width 1s ease;
  position: relative;
  box-shadow: 0 2px 8px rgba(240,180,0,0.5), 0 0 16px rgba(255,220,0,0.3);
}
.progress-fill::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, transparent 60%);
  border-radius: 9px;
}

/* ── SETTINGS ── */
.settings-toggle {
  position: fixed; top: 16px; right: 16px; z-index: 20;
  background: rgba(255,255,255,0.18); backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.3); border-radius: 50%;
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 1.2rem; transition: background 0.2s;
}
.settings-toggle:hover { background: rgba(255,255,255,0.3); }

.settings-panel {
  position: fixed; top: 68px; right: 16px; z-index: 20;
  background: rgba(0,40,80,0.96); backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.2); border-radius: 20px;
  padding: 20px 24px; box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  display: none; min-width: 260px; color: white;
}
.settings-panel.open { display: block; animation: popIn 0.2s ease; }
.settings-title { font-weight: 800; font-size: 14px; margin-bottom: 14px; color: #80d0ff; }
.settings-field { margin-bottom: 12px; }
.settings-field label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 6px; }
.settings-field input { width: 100%; padding: 9px 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; font-family: 'Nunito', sans-serif; font-size: 14px; color: white; }
.settings-field input:focus { outline: none; border-color: #80d0ff; }
.save-btn { width: 100%; padding: 10px; background: linear-gradient(135deg, #0080c0, #004880); color: white; border: none; border-radius: 10px; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 4px; }
.save-btn:hover { opacity: 0.88; }

/* ── FIREWORKS ── */
.firework {
  position: fixed; z-index: 50; pointer-events: none;
  width: 8px; height: 8px; border-radius: 50%;
  animation: explode 1.5s ease-out forwards;
}
@keyframes explode {
  0%   { transform:translate(0,0) scale(1); opacity:1; }
  100% { transform:translate(var(--tx),var(--ty)) scale(0); opacity:0; }
}
</style>
</head>
<body>

<!-- Background -->
<div class="water"></div>
<div class="rays" id="rays"></div>
<div class="surface"></div>

<!-- Sandy bottom -->
<div class="sand"></div>

<!-- Coral — more pieces, varied sizes -->
<div class="coral" style="left:2%;   bottom:90px;  font-size:4rem;   --sway-start:-4deg; --sway-end:4deg;   animation-duration:3s;">🪸</div>

<div class="coral" style="left:96%;  bottom:90px;  font-size:1.8rem; --sway-start:-5deg; --sway-end:4deg;   animation-duration:3s;">🪸</div>

<!-- Sea creatures (behind content via z-index) -->
<div id="creatures"></div>

<!-- Bubbles -->
<div id="bubbles"></div>

<!-- Settings -->
<div class="settings-toggle" onclick="toggleSettings()">⚙️</div>
<div class="settings-panel" id="settings">
  <div class="settings-title">⚙️ Settings</div>
  <div class="settings-field">
    <label>Last Day (date)</label>
    <input type="date" id="end-date-input"/>

  <div class="settings-field">
    <label>End Time</label>
    <input type="time" id="end-time-input"/>

    <label>Your Name / School</label>
    <input type="text" id="name-input" placeholder="e.g. Chingshin Academy"/>

<!-- Main content -->
<div class="content">

  <div class="main-card">
    <div class="headline" id="headline">🐠 Countdown to Holidays</div>

  <div class="progress-wrap">

</div>

  "Teachers don't get tired. They get... very very tired. But then they get holidays. 😴",
  "Like a clownfish finding home — you're almost back to your anemone. 🐟",
  "Dive deep. Work hard. Surface soon. 🤿",
  "The reef is beautiful. But so is what's waiting on the other side of the holiday. 🌴",
];

function getEndDateTime() {
  const d = localStorage.getItem('holidays_end_date') || DEFAULT_END_DATE;
  const t = localStorage.getItem('holidays_end_time') || DEFAULT_END_TIME;
  const [h, m] = t.split(':').map(Number);
  const dt = new Date(d + 'T00:00:00');
  dt.setHours(h, m, 0, 0);
  return dt;
}

function getAffirmation() {
  const day = Math.floor(Date.now() / 86400000);
  return affirmations[day % affirmations.length];
}

function checkMilestone(days, isBeforeStart) {
  const el = document.getElementById('milestone');
  if (isBeforeStart) {
    el.textContent = "🐠 Ready to dive in! Semester begins August 31 — the water's warm!";
    el.classList.add('show'); return;
  }
  const map = {
    60: "🐠 60 days! The current is moving in the right direction!",
    30: "🌊 One month to go! You can almost taste the salt air!",
    20: "🐢 20 days! The turtle is almost at the surface!",
    14: "🤿 Two weeks! Time to start thinking about what you'll do first!",
    10: "🐡 10 days! Nearly there — keep swimming!",
     7: "🎊 One week left! SEVEN DAYS!",
     5: "🐚 Five days! You can hear the waves!",
     3: "⚡ THREE DAYS. Almost surfaced.",
     2: "😱 TWO DAYS. This is not a drill.",
     1: "🚨 TOMORROW IS THE LAST DAY! 🚨",
     0: "🏖️ HOLIDAYS ARE HERE! SURFACE! 🎉🐠🎉",
  };
  if (map[days] !== undefined) {
    el.textContent = map[days]; el.classList.add('show');
  } else {
    el.classList.remove('show');
  }
}

function launchFireworks() {
  for (let i = 0; i < 70; i++) {
    setTimeout(() => {
      const fw = document.createElement('div');
      fw.className = 'firework';
      const cols = ['#ff6b6b','#ffd166','#06d6a0','#80d0ff','#f9a8d4','#ffffff','#ffa500'];
      fw.style.background = cols[Math.floor(Math.random() * cols.length)];
      fw.style.left = (10 + Math.random() * 80) + 'vw';
      fw.style.top  = (5  + Math.random() * 70) + 'vh';
      const angle = Math.random() * Math.PI * 2;
      const dist  = 80 + Math.random() * 150;
      fw.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
      fw.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
      document.body.appendChild(fw);
      setTimeout(() => fw.remove(), 1800);
    }, Math.random() * 3500);
  }
}

let tickTimer;
function tick() {
  const now  = new Date();
  const end  = getEndDateTime();
  const isBeforeStart = now < SEMESTER_START;

  const diffMs    = end - now;
  const totalDays = Math.max(0, Math.ceil(diffMs / 86400000));
  const diffSecs  = Math.max(0, Math.floor(diffMs / 1000));
  const hours     = Math.floor((diffSecs % 86400) / 3600);
  const mins      = Math.floor((diffSecs % 3600) / 60);
  const secs      = diffSecs % 60;

  document.getElementById('big-days').textContent = totalDays;
  document.getElementById('hms-h').textContent = String(hours).padStart(2,'0');
  document.getElementById('hms-m').textContent = String(mins).padStart(2,'0');
  document.getElementById('hms-s').textContent = String(secs).padStart(2,'0');

  // Mondays
  let mondays = 0;
  const cur = new Date(now);
  while (cur <= end) { if (cur.getDay() === 1) mondays++; cur.setDate(cur.getDate()+1); }
  document.getElementById('stat-mondays').textContent = mondays;
  document.getElementById('stat-coffees').textContent = totalDays * COFFEES_PER_DAY;

  // Progress
  let pct = 0;
  if (!isBeforeStart) {
    const totalSem = end - SEMESTER_START;
    const elapsed  = now - SEMESTER_START;
    pct = Math.min(100, Math.max(0, Math.round((elapsed / totalSem) * 100)));
  }
  document.getElementById('stat-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('prog-pct-label').textContent =
    isBeforeStart ? '🐠 Semester starts Aug 31!' : pct + '% of the semester done';

  const name = localStorage.getItem('holidays_name') || '';
  document.getElementById('headline').textContent =
    name ? `🐠 ${name} — Countdown to Holidays` : '🐠 Countdown to Holidays';

  document.getElementById('affirmation').textContent = '"' + getAffirmation() + '"';
  checkMilestone(totalDays, isBeforeStart);
  if (!isBeforeStart && diffSecs === 0) launchFireworks();

  tickTimer = setTimeout(tick, 1000);
}

function toggleSettings() { document.getElementById('settings').classList.toggle('open'); }
function saveSettings() {
  const d = document.getElementById('end-date-input').value;
  const t = document.getElementById('end-time-input').value;
  const n = document.getElementById('name-input').value.trim();
  if (d) localStorage.setItem('holidays_end_date', d);
  if (t) localStorage.setItem('holidays_end_time', t);
  localStorage.setItem('holidays_name', n);
  document.getElementById('settings').classList.remove('open');
}

// ── BUILD LIGHT RAYS ──────────────────────────────────────────────────────────
function makeRays() {
  const wrap = document.getElementById('rays');
  const configs = [
    { left:'8%',  w:60,  op:0.18, start:-12, end:-6,  dur:5  },
    { left:'18%', w:90,  op:0.22, start:-6,  end:2,   dur:7  },
    { left:'30%', w:70,  op:0.16, start:-4,  end:4,   dur:6  },
    { left:'44%', w:110, op:0.25, start:-8,  end:6,   dur:8  },
    { left:'58%', w:80,  op:0.20, start:4,   end:-4,  dur:5.5},
    { left:'70%', w:95,  op:0.22, start:6,   end:-2,  dur:7  },
    { left:'82%', w:65,  op:0.17, start:8,   end:2,   dur:6  },
    { left:'92%', w:50,  op:0.15, start:10,  end:4,   dur:5  },
  ];
  configs.forEach(c => {
    const el = document.createElement('div');
    el.className = 'ray';
    el.style.cssText = `
      left:${c.left}; width:${c.w}px;
      --op:${c.op};
      --start-angle:${c.start}deg;
      --end-angle:${c.end}deg;
      animation-duration:${c.dur}s;
      animation-delay:${-Math.random()*c.dur}s;
    `;
    wrap.appendChild(el);
  });
}

// ── BUILD BUBBLES ─────────────────────────────────────────────────────────────
function makeBubbles() {
  const wrap = document.getElementById('bubbles');
  for (let i = 0; i < 20; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const sz = 4 + Math.random() * 12;
    b.style.cssText = `
      left:${Math.random()*100}%;
      bottom:${80 + Math.random()*200}px;
      width:${sz}px; height:${sz}px;
      --drift:${-20+Math.random()*40}px;
      animation-duration:${40+Math.random()*30}s;
      animation-delay:${Math.random()*30}s;
    `;
    wrap.appendChild(b);
  }
}

// ── BUILD SEA CREATURES ───────────────────────────────────────────────────────
function makeCreatures() {
  const wrap = document.getElementById('creatures');

  // All fish swim left-to-right — emoji face right via scaleX(-1) since fish glyphs default face left
  const allFish = [
    { emoji:'🐠', top:'22%', dur:18, delay:0,   size:'3.2rem', bobMid:'-15px', bobEnd:'5px'  },
    { emoji:'🐡', top:'55%', dur:25, delay:8,   size:'3rem',   bobMid:'10px',  bobEnd:'-8px' },
    { emoji:'🐟', top:'38%', dur:20, delay:14,  size:'2.8rem', bobMid:'-8px',  bobEnd:'12px' },
    { emoji:'🦈', top:'48%', dur:35, delay:5,   size:'7rem',   bobMid:'5px',   bobEnd:'-5px' },
    { emoji:'🐠', top:'68%', dur:22, delay:18,  size:'2.6rem', bobMid:'-10px', bobEnd:'8px'  },
    { emoji:'🐬', top:'28%', dur:30, delay:22,  size:'7rem',   bobMid:'-18px', bobEnd:'10px' },
    { emoji:'🐡', top:'72%', dur:18, delay:9,   size:'2.4rem', bobMid:'8px',   bobEnd:'-6px' },
    { emoji:'🐟', top:'30%', dur:28, delay:3,   size:'3rem',   bobMid:'12px',  bobEnd:'-6px' },
    { emoji:'🐠', top:'60%', dur:24, delay:12,  size:'3.4rem', bobMid:'-12px', bobEnd:'6px'  },
    { emoji:'🐡', top:'44%', dur:19, delay:7,   size:'2.8rem', bobMid:'8px',   bobEnd:'-10px'},
    { emoji:'🐟', top:'18%', dur:32, delay:16,  size:'2.4rem', bobMid:'-10px', bobEnd:'8px'  },
  ];
  allFish.forEach(f => {
    const el = document.createElement('div');
    el.className = 'creature fish-lr';
    el.style.cssText = `
      top:${f.top}; left:0; font-size:${f.size};
      --bob-mid:${f.bobMid}; --bob-end:${f.bobEnd};
      animation-duration:${f.dur}s;
      animation-delay:-${f.delay}s;
    `;
    // Fish emoji glyphs face LEFT by default — flip them so they face RIGHT (direction of travel)
    const span = document.createElement('span');
    span.style.display = 'inline-block';
    span.style.transform = 'scaleX(-1)';
    span.textContent = f.emoji;
    el.appendChild(span);
    wrap.appendChild(el);
  });

  // Sea turtle (slow and majestic)
  const turtle = document.createElement('div');
  turtle.className = 'creature turtle';
  turtle.textContent = '🐢';
  turtle.style.cssText = `top:35%; left:0; font-size:3.2rem; animation-duration:45s; animation-delay:-10s;`;
  wrap.appendChild(turtle);

  // Second turtle
  const turtle2 = document.createElement('div');
  turtle2.className = 'creature turtle';
  turtle2.textContent = '🐢';
  turtle2.style.cssText = `top:62%; left:0; font-size:2.4rem; animation-duration:55s; animation-delay:-28s;`;
  wrap.appendChild(turtle2);

  // Octopus (bobbing near bottom left)
  const octo = document.createElement('div');
  octo.className = 'creature octopus';
  octo.textContent = '🐙';
  octo.style.cssText = `bottom:110px; left:8%; font-size:3rem; animation-duration:5s; animation-delay:-1s;`;
  wrap.appendChild(octo);

  // Second octopus near bottom right
  const octo2 = document.createElement('div');
  octo2.className = 'creature octopus';
  octo2.textContent = '🐙';
  octo2.style.cssText = `bottom:100px; right:10%; font-size:2.2rem; animation-duration:6s; animation-delay:-3s;`;
  wrap.appendChild(octo2);

  // Jellyfish drifting down slowly
  const jellies = [
    { left:'15%', bottom:'60%', dur:12, delay:0   },
    { left:'78%', bottom:'50%', dur:15, delay:-6  },
    { left:'45%', bottom:'70%', dur:10, delay:-4  },
  ];
  jellies.forEach(j => {
    const el = document.createElement('div');
    el.className = 'creature octopus'; // reuse bobbing animation
    el.textContent = '🪼';
    el.style.cssText = `bottom:${j.bottom}; left:${j.left}; font-size:2rem; animation-duration:${j.dur}s; animation-delay:-${j.delay}s;`;
    wrap.appendChild(el);
  });

  // Crab on the sand
  const crab = document.createElement('div');
  crab.textContent = '🦀';
  crab.style.cssText = `position:fixed; bottom:85px; left:25%; font-size:1.8rem; z-index:6; animation:coralSway 3s ease-in-out infinite alternate; --sway-start:-8deg; --sway-end:8deg;`;
  wrap.appendChild(crab);

  // School of small fish
  const school = document.createElement('div');
  school.className = 'school';
  school.style.cssText = `top:28%; left:0; animation-duration:16s; animation-delay:-6s;`;
  for (let i = 0; i < 6; i++) {
    const sf = document.createElement('div');
    sf.className = 'school-fish';
    sf.textContent = '🐟';
    sf.style.cssText = `margin-top:${i % 2 === 0 ? '0' : '8px'}; opacity:${0.7 + Math.random()*0.3};`;
    school.appendChild(sf);
  }
  wrap.appendChild(school);

  // Second school
  const school2 = document.createElement('div');
  school2.className = 'school';
  school2.style.cssText = `top:52%; left:0; animation-duration:20s; animation-delay:-14s;`;
  for (let i = 0; i < 5; i++) {
    const sf = document.createElement('div');
    sf.className = 'school-fish';
    sf.textContent = '🐠';
    sf.style.cssText = `margin-top:${i % 2 === 0 ? '0' : '6px'}; font-size:0.95rem;`;
    school2.appendChild(sf);
  }
  wrap.appendChild(school2);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
window.onload = () => {
  document.getElementById('end-date-input').value = localStorage.getItem('holidays_end_date') || DEFAULT_END_DATE;
  document.getElementById('end-time-input').value = localStorage.getItem('holidays_end_time') || DEFAULT_END_TIME;
  document.getElementById('name-input').value     = localStorage.getItem('holidays_name') || '';
  makeRays();
  makeBubbles();
  makeCreatures();
  tick();
};
</script>
